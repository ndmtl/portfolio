<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathalie Depierre, designer multimedia - intégration, Montréal ou à distance.</title>
  <meta name="description"
    content="Designer multidisciplinaire Ux/ui design et intégratrice. Architecture, expérience utilisateur, prototypage, design visuel, Montréal ou à distance.">
  <!--Favicon-->
  <link rel=" icon" type="image/x-icon" href="assets/img/d-final_round.png">
  <!--Font Awesome-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!--Styles-->
  <link rel="stylesheet" href="assets/css/normalize.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!--JS-->
  <script src="assets/js/script.js" defer></script>

</head>

<body>




  <header id="navbar"></header>

  <script>
    fetch('_navbar.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;

        const toggle = document.querySelector('.toggle');
        const overlay = document.querySelector('.overlay');

        toggle.addEventListener('click', () => {
          toggle.classList.toggle('open');
          overlay.classList.toggle('open');
        });
      });
  </script>

  <main>

    <section id="contact">
      <div class="container">
        <div>
          <p class="space">As a multidisciplinary designer specializing in integration, UX/UI design,
            and graphic design</p>
          <p class="space">Basée à Montréal</p>
          <p class="space">
            <i class="fa-brands fa-linkedin"></i> <a href="https://www.linkedin.com/in/nathalie-depierre/">Linkedin</a>
          </p><i class="fa-brands fa-square-instagram"></i>
          <a href="https://www.instagram.com/nathaliedepierremtl/">Instagram</a></p>
          <p> <i class="fa-brands fa-github"></i> <a href="https://github.com/ndmtl">Github</a></p>
        </div>
        <div>
          <form id="contactForm" action="confirmation.html" method="get" novalidate>

            <div>

              <div class="inputControl">
                <label for="name">Nom et prénom*</label>
                <input type="text" name="name" id="name" placeholder="Nom et prénom*">
                <div class="errorMessage"></div>
              </div>
              <div class="inputControl">
                <label for="phone">Téléphone*</label>
                <input type="tel" name="phone" id="phone" placeholder="xxx xxx-xxxx" required>
                <div class="errorMessage"></div>
              </div>
              <div class="inputControl">
                <label for="email">Courriel</label>
                <input type="email" name="email" id="email" placeholder="nom@domaine.com">
                <div class="errorMessage"></div>
              </div>




              <div class="inputControl">

                <label for="message">Message additionnel</label>
                <textarea name="message" id="message" rows="6"> </textarea>
                <div class="errorMessage"></div>
              </div>


              <button type="submit">Soumettre</button>

          </form>
        </div>
      </div>
      </div>
    </section>

  </main>
  <footer id="footer">
    <div class="first-row">
      <div class="footer-cta">
        <span class="fl" id="fl1">LET'S BUILD</span>
        <span class="fl fl-red" id="fl2">SOMETHING</span>
        <span class="fl" id="fl3">TOGETHER.</span>
      </div>
      <div>
        <a class="contact-circle">

          <!-- 1. SVG texte circulaire — en absolu, pleine taille -->
          <svg id="rotatingText" viewBox="0 0 140 140">
            <defs>
              <path id="circle-path" d="M70,70 m-45,0 a45,45 0 1,1 90,0 a45,45 0 1,1 -90,0" />
            </defs>
            <text>
              <textPath href="#circle-path">
                GE T IN TOUCH • GET IN TOUCH •
              </textPath>
            </text>
          </svg>

          <!-- 2. Point central avec flèche — centré par-dessus -->
          <div class="dot">
            <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
              <path
                d="M400,600c-50.5,0-89.1-25.2-113.35-47.25-10.29-9.38-19.72-19.65-28.2-30.7-3.82-4.88-7.35-9.97-10.6-15.25-10.38-17.92-4.27-40.86,13.65-51.25,17.47-10.12,39.81-4.6,50.55,12.5,7.14,10.7,15.53,20.5,25,29.2,17.05,15.5,38.45,27.75,62.95,27.75s45.9-12.3,62.9-27.75c9.47-8.7,17.86-18.5,25-29.2,10.7-17.74,33.76-23.45,51.5-12.75s23.45,33.76,12.75,51.5h0l-10.6,15.25c-6.4,8.35-15.85,19.5-28.2,30.7-24.25,22-62.85,47.25-113.35,47.25ZM250,300c0-27.61,22.39-50,50-50h.35c27.61,0,50,22.39,50,50s-22.39,50-50,50h-.35c-27.61,0-50-22.39-50-50ZM500,250c-27.61,0-50,22.39-50,50s22.39,50,50,50h.35c27.61,0,50-22.39,50-50s-22.39-50-50-50h-.35Z" />
              <path
                d="M400,0C179.09,0,0,179.09,0,400s179.09,400,400,400,400-179.09,400-400S620.91,0,400,0ZM75,400c0-179.49,145.51-325,325-325s325,145.51,325,325-145.51,325-325,325S75,579.49,75,400Z"
                style="fill-rule: evenodd;" />
            </svg>
          </div>

        </a>
      </div>
    </div>
    <div class="footer-bot">
      <span>© Copyright 2026 </span><span>Based in Montreal</span><span>Coded with ♡ by Nathalie Depierre</span>
    </div>
  </footer>

</body>

</html>
