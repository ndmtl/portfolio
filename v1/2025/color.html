<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Change on Scroll</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 500vh; /* Pour avoir assez d'espace pour scroller */
        }

        .color-section {
            height: 100vh;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
            color: white;
            padding: 2rem;
            font-family: 'Neue Montreal', sans-serif;
        }

        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
    </style>
</head>
<body>
    <div class="color-section"></div>
    
    <div class="content">
        <div class="section">Section 1</div>
        <div class="section">Section 2</div>
        <div class="section">Section 3</div>
        <div class="section">Section 4</div>
        <div class="section">Section 5</div>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Définition des couleurs pour chaque section
        const colors = ['#1a1a1a', '#2c3e50', '#8e44ad', '#c0392b', '#16a085'];

        // Animation de la couleur de fond
        gsap.to('.color-section', {
            scrollTrigger: {
                trigger: 'body',
                start: 'top top',
                end: 'bottom bottom',
                scrub: 1,
                onUpdate: (self) => {
                    // Calcul de l'index de couleur basé sur le scroll
                    const progress = self.progress;
                    const totalColors = colors.length - 1;
                    const colorIndex = Math.floor(progress * totalColors);
                    const nextColorIndex = Math.min(colorIndex + 1, totalColors);
                    const colorProgress = (progress * totalColors) % 1;

                    // Interpolation entre les couleurs
                    const currentColor = gsap.utils.splitColor(colors[colorIndex]);
                    const nextColor = gsap.utils.splitColor(colors[nextColorIndex]);
                    
                    const r = Math.round(gsap.utils.interpolate(currentColor[0], nextColor[0], colorProgress));
                    const g = Math.round(gsap.utils.interpolate(currentColor[1], nextColor[1], colorProgress));
                    const b = Math.round(gsap.utils.interpolate(currentColor[2], nextColor[2], colorProgress));

                    gsap.set('.color-section', {
                        backgroundColor: `rgb(${r},${g},${b})`
                    });
                }
            }
        });
    </script>
</body>
</html>
