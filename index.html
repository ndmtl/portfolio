                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"

                  class="w-4 h-4 transition-transform duration-200 ease-in-out group-hover:translate-x-0.5 group-hover:-translate-y-0.5">

              <p class="group inline-flex items-center w-[200px]">

                  viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                  class="w-4 h-4 transition-transform duration-200 ease-in-out group-hover:translate-x-0.5 group-hover:-translate-y-0.5">

              </p>
            </div>
          </div>

          <!-- Colonne formulaire -->
          <div class="col-span-12 lg:col-span-8 sm:col-span-12">

            <!-- Bizarrement si je mets des doubles quotes le prettier me met un espace devant la classe o_O-->
            <form id='contactForm' action='#' method=" get" novalidate class="p-4 lg:p-24 s">
              <p id="messageConfirmation" class="p-6"></p>
              <!-- Champ Nom -->
              <div class="inputControl mb-6 flex flex-col">
                <label for="fullName" class="block mb-1 text-sm font-medium">nom et prénom*</label>
                <input type="text" name="fullName" id="fullName"
                  class="w-full h-[36px] bg-transparent border-b-2 border-black focus:outline-none focus:border-sky-500">
                <div class="errorMessage text-red-600 text-xs mt-1"></div>
              </div>

              <!-- Champ Email -->
              <div class="inputControl mb-12 flex flex-col">
                <label for="email" class="block mb-1 text-sm font-medium">courriel (nom@domaine.com)*</label>
                <input type="email" name="email" id="email" required
                  class="w-full h-[36px] bg-transparent border-b-2 border-black  focus:outline-none focus:border-sky-500">
                <div class="errorMessage"></div>
              </div>

              <!-- Champ Téléphone -->
              <div class="inputControl mb-12 flex flex-col">
                <label for="phone" class="block mb-1 text-sm font-medium">téléphone*</label>
                <input type="tel" name="phone" id="phone" required
                  class="w-full h-[36px] bg-transparent border-b-2 border-black  focus:outline-none focus:border-sky-500">
                <div class="errorMessage"></div>
              </div>

              <!-- Champ Message -->
              <div class="inputControl mb-12 flex flex-col">
                <label for="message" required class="block mb-1 text-sm font-medium">message*</label>

                <textarea name="message" id="message" rows="4"
                  class="w-full bg-transparent  border-b-2 border-black  focus:outline-none focus:border-sky-500 resize-none"></textarea>
                <div class="errorMessage"></div>
              </div>

              <button type="submit"
                class="group inline-flex items-center gap-2 bg-black text-white hover:bg-blue-700 transition-colors duration-200 ease-in-out px-6 py-3 cursor-pointer">
                <span>envoyer le message</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor"
                  class="w-4 h-4 transition-transform duration-200 ease-in-out group-hover:translate-x-0.5 group-hover:-translate-y-0.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
                </svg>
              </button>
            </form>
