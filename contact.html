    <section id="contact" class="w-full px-6 py-16" data-fade-group>

        <div class="w-full grid grid-cols-12 lg:gap-12">

          <!-- Colonne gauche -->
          <div class="col-span-12 lg:col-span-5 pt-18 fade">

            </h1>

            <!-- Colonne gauche  -->
            <div class="hidden lg:pl-24 lg:pt-12 lg:flex lg:flex-col gap-3 text-base font-mono uppercase">

              <a href="https://www.linkedin.com/in/nathalie-depierre/" target="_blank" rel="noopener noreferrer"
                class="group inline-flex items-center gap-1 hover:text-accent">
                LinkedIn
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor"
                  class="w-3 h-3 transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
                </svg>
              </a>

              <a href="https://www.instagram.com/nathaliedepierremtl/" target="_blank" rel="noopener noreferrer"
                class="group inline-flex items-center gap-1 hover:text-accent">
                Instagram
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor"
                  class="w-3 h-3 transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
                </svg>
              </a>

              <a href="https://github.com/ndmtl" target="_blank" rel="noopener noreferrer"
                class="group inline-flex items-center gap-1 hover:text-accent">
                GitHub
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor"
                  class="w-3 h-3 transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
                </svg>
              </a>

            </div>

          <!-- Colonne gauche  -->
          <!-- Colonne formulaire -->
          <div class="col-span-12 lg:col-span-7 fade">

            <!-- Bizarrement si je mets des guillemets le prettier met espace devant la classe o_O-->
            <form id='contactForm' action='#' method=" get" novalidate class="p-0 py-12 lg:p-24">

              <!-- Champ Nom -->
              <div class="input__control mb-6 flex flex-col">
                <label for="fullName" class="block mb-1 text-base font-medium">nom et prénom*</label>
                <input type="text" name="fullName" id="fullName"
                  class="w-full h-[36px] bg-transparent border-b-2 border-black focus:outline-none focus:border-accent">
                <div class="message__error "></div>
              </div>

              <!-- Champ Email -->
              <div class="input__control mb-12 flex flex-col">
                <label for="email" class="block mb-1 text-base font-medium">courriel (nom@domaine.com)*</label>
                <input type="email" name="email" id="email" required
                  class="w-full h-[36px] bg-transparent border-b-2 border-black focus:outline-none focus:border-accent">
                <div class="message__error "></div>
              </div>

              <!-- Champ Téléphone -->
              <div class="input__control mb-12 flex flex-col">
                <label for="phone" class="block mb-1 text-base font-medium">téléphone (12345678)</label>
                <input type="tel" name="phone" id="phone" required
                  class="w-full h-[36px] bg-transparent border-b-2 border-black  focus:outline-none focus:border-accent">
                <div class="message__error "></div>
              </div>

              <!--Entreprise facultatif-->
              <div class="inpuControl mb-12 flex flex-col">
                <label for="company" class="block mb-1 text-base font-medium">organisation/compagnie</label>
                <input type="text" name="company" id="company"
                  class="w-full h-[36px] bg-transparent border-b-2 border-black  focus:outline-none focus:border-accent">
                <div class="message__error "></div>
              </div>

              <!-- Sujet -->
              <div class="input__control mb-12 flex flex-col">
                <label for="subject" class="block mb-1 text-base font-medium">type de projet*</label>
                <select name="subject" id="subject" required
                  class="w-full h-[36px] bg-transparent border-b-2 border-black  focus:outline-none focus:border-accent">
                  <option value="">Choisissez</option>
                  <option value="Integration">Site web</option>
                  <option value="Prototypage UX">UX-UI</option>
                  <option value="Prototypage UI">Refonte</option>
                  <option value="Graphisme">Graphisme</option>
                </select>
                <div class="message__error "></div>
              </div>
              <!-- Budget -->
              <div class="input__control mb-12 flex flex-col">
                <label for="budget" class="block mb-1 text-base font-medium">quel est votre budget ?*</label>
                <select name="budget" id="budget" required
                  class="w-full h-[36px] bg-transparent border-b-2 border-black  focus:outline-none focus:border-accent">
                  <option value="">Choisissez</option>
                  <option value="3000-5000">3000-5000</option>
                  <option value="5000-10000">5000-10000</option>
                  <option value="10000-15000">10000-15000</option>
                  <option value="10000+">10000+</option>
                </select>
                <div class="message__error "></div>
              </div>

              <!--Échéance-->
              <div class="input__control mb-12 flex flex-col" role="radiogroup" aria-labelledby="deadline-label"
                aria-describedby="deadline-error">
                <span id="deadline-label">échéance*</span>
                <div>
                  <input type="radio" id="size1" name="deadline" value="1" required>
                  <label for="size1">ASAP</label>
                </div>
                <div>
                  <input type="radio" id="size2_10" name="deadline" value="2-10">
                  <label for="size2_10">1-3 mois</label>
                </div>
                <div>
                  <input type="radio" id="size11_50" name="deadline" value="11-50">
                  <label for="size11_50">3-6mois</label>
                </div>
                <div>
                  <input type="radio" id="size51" name="deadline" value="51+">
                  <label for="size51">flexible</label>
                </div>
                <div class="message__error "></div>
              </div>
              <!-- Champ Message -->
              <div class="input__control mb-12 flex flex-col">
                <label for="message" required class="block mb-1 text-base font-medium">décrivez votre projet*</label>

                <textarea name="message" id="message" rows="4"
                  class="w-full bg-transparent  border-b-2 border-black  focus:outline-none focus:border-accent resize-none"></textarea>
                <div class="message__error "></div>
              </div>
              <p id="confirmation"></p>
              <button type="submit"
                class="group inline-flex items-center gap-2 bg-black text-white hover:bg-accent transition-colors duration-200 ease-in-out px-6 py-3 cursor-pointer">
                <span>envoyer le message</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor"
                  class="w-4 h-4 transition-transform duration-200 ease-in-out group-hover:translate-x-0.5 group-hover:-translate-y-0.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
                </svg>

              </button>
            </form>
          </div>

        </div>
      </div>
