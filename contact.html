<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathalie Depierre, multimedia designer - web integrator based in Montreal </title>
  <meta name="description"
    content="Designer multidisciplinaire intégratrice, Ux/ui design et graphiste, J’accompagne les entreprises dans leurs projets de communication visuelle et numérique">
  <!--Favicon-->
  <link rel=" icon" type="image/x-icon" href="assets/img/d-final_round.png">
  <!--Font Awesome-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!--Styles-->
  <link rel="stylesheet" href="assets/css/normalize.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!--JS-->
  <script src="assets/js/script.js" defer></script>

</head>

<body>

  <div id="cursor"></div>


  <header id="navbar"></header>

  <script>
    fetch('_navbar.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;

        const toggle = document.querySelector('.toggle');
        const overlay = document.querySelector('.overlay');

        toggle.addEventListener('click', () => {
          toggle.classList.toggle('open');
          overlay.classList.toggle('open');
        });
      });
  </script>

  <main>

    <section id="contact">
      <div class="container">
        <div>
          <p class="space">As a multidisciplinary designer specializing in integration, UX/UI design,
            and graphic design</p>
          <p class="space">Basée à Montréal</p>
          <p class="space">
            <a href="https://www.linkedin.com/in/nathalie-depierre/">Linkedin</a>
          </p>
          <a href="https://www.instagram.com/nathaliedepierremtl/">Instagram</a></p>
          <p><a href="https://github.com/ndmtl">Github</a></p>
        </div>
        <div>
          <form action=" confirmation-reservation.html" method="get">

            <div>

              <div>
                <label for="name">Nom et prénom*</label>
                <input type="text" name="lastName" id="name" placeholder="Nom et prénom*">
              </div>
              <div>
                <label for="phone">Téléphone*</label>
                <input type="tel" name="phone" id="phone" placeholder="xxx xxx-xxxx" required>
              </div>
              <div>
                <label for="email">Courriel</label>
                <input type="email" name="email" id="email" placeholder="nom@domaine.com">
              </div>

              <div>

                <label for="message">Message additionnel</label>
                <textarea name="message" id="message" rows="6"> </textarea>
              </div>


              <button type="submit">Soumettre la réservation</button>

          </form>
        </div>
      </div>
      </div>
    </section>

  </main>
  <footer id="footer">
    <div class="footer-cta">
      <span class="fl" id="fl1">LET'S BUILD</span>
      <span class="fl fl-red" id="fl2">SOMETHING</span>
      <span class="fl" id="fl3">TOGETHER.</span>
    </div>
    <div class="footer-bot">
      <span>© 2026 Nathalie Depierre</span><span>Fait avec ♡ à Montréal</span><span>contact@dblocs.com</span>
    </div>
  </footer>

</body>

</html>
