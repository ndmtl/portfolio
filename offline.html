<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne. Nathalie Depierre, designer multimedia - intégration, Montréal ou à distance.</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-color: #000;
            color: #fff;
            padding-top: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;

        }

        h1 {
            color: #fff;
        }

        button {
            background-color: #fff;
            color: 000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>nathaliedepierre.com</h1>
        <h2>Oups ! Vous êtes hors ligne</h2>
        <p>Il semble que votre connexion Internet soit interrompue.<br>
            Veuillez vérifier votre réseau et réessayer.</p>
        <button onclick="window.location.reload()">Réessayer</button>
    </div>

    <script>
        // Recharge la page dès que la connexion revient
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
